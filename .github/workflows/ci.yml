name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash version
        run: bash --version

      - name: Run tests
        run: bash scripts/run-tests.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Shellcheck runs at warning severity, blocking on warnings and errors.
      - name: Run shellcheck
        run: shellcheck -S warning scripts/*.sh tests/*.sh drivers/*.sh

  manifests:
    name: manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check manifests
        run: bash tests/manifest.sh

      - name: Check doc links
        run: bash tests/doc-links.sh
